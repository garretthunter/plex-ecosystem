##
# Prowlarr - Torrent and Usenet indexing service https://prowlarr.com/
# Docker Hub: https://hub.docker.com/r/linuxserver/prowlarr
#
# Note: Restore from backup after recreating the container
##
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
    volumes:
      - ${HOST_MOUNT}/config/prowlarr:/config
      - ${HOST_MOUNT}/backups/prowlarr:/config/Backups
    healthcheck:
      test: curl -sf http://localhost:9696/ping || exit 1
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Capped so this can't monopolize this 4-thread host and starve Plex playback:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - media
      - proxied

networks:
  media:
  proxied:
    external: true
    name: proxied
