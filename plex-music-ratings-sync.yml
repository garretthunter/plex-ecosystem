##
# Plex Music Ratings Sync - Sync ratings between Plex and music file metadata
# GitHub: https://github.com/rfgamaral/plex-music-ratings-sync
##
services:
  plex-music-ratings-sync:
    image: ghcr.io/rfgamaral/plex-music-ratings-sync
    container_name: plex-music-ratings-sync
    command: sync
    restart: on-failure:2
    environment:
      - PUID=1000
      - PGID=1000
    depends_on:
      plex:
        condition: service_healthy
    volumes:
      - ${HOST_MOUNT}/config/plex-music-ratings-sync:/app/data
      - ${HOST_MOUNT}/data/media/music:/data/media/music

  ofelia-scheduler:
    image: mcuadros/ofelia
    container_name: ofelia-scheduler
    network_mode: host
    command: daemon --docker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      # job-run spins up a brand-new container from `image` each tick, so it needs its own
      # copy of the command/env/volumes plex-music-ratings-sync defines above (job-run has
      # no way to just "start" that existing one-shot container - see mcuadros/ofelia#147).
      ofelia.job-run.plex-music-ratings-sync.schedule: '@daily'
      ofelia.job-run.plex-music-ratings-sync.image: 'ghcr.io/rfgamaral/plex-music-ratings-sync'
      ofelia.job-run.plex-music-ratings-sync.command: 'sync'
      ofelia.job-run.plex-music-ratings-sync.environment: '["PUID=1000","PGID=1000"]'
      ofelia.job-run.plex-music-ratings-sync.volume: '["${HOST_MOUNT}/config/plex-music-ratings-sync:/app/data","${HOST_MOUNT}/data/media/music:/data/media/music"]'
